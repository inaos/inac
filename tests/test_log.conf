global {
    buffer_size=4096
}
rule "*.*" {
    target="all.log"
}

rule "test.DEBUG" {
    target="test_all.log"
}

rule "test.*" {
    target="test_all.log"
}

rule "test.DEBUG" {
    target="test_debug.log"
}

rule "test.ERROR" {
    target="test_error.log"
}

rule "test.WARNING" {
    target="test_warning.log"
}

rule "nolog.*" {
    target="nolog_all.log"
}

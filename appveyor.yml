      BUILD_ARCH: x86_64
      SONAR_BW: build-wrapper-win-x86-64.exe

    - MY_NAME: Windows VS 2015 Release 32bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2015
      VSINSTALL: "Microsoft Visual Studio 14.0\\VC"
      MSVC_PLATFORM: x86
      BUILD_CONFIGURATION: release
      BUILD_ARCH: x86
      SONAR_BW: build-wrapper-win-x86-32.exe

    - MY_NAME: Windows VS 2015 Release 64bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2015
      VSINSTALL: "Microsoft Visual Studio 14.0\\VC"
      MSVC_PLATFORM: amd64
      BUILD_CONFIGURATION: release
      BUILD_ARCH: x86_64
      SONAR_BW: build-wrapper-win-x86-64.exe

    - MY_NAME: Windows VS 2017 Debug 32bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2017
      VSINSTALL: "Microsoft Visual Studio\\2017\\Community\\VC\\Auxiliary\\Build"
      MSVC_PLATFORM: x86
      BUILD_CONFIGURATION: debug
      BUILD_ARCH: x86
      SONAR_BW: build-wrapper-win-x86-32.exe

    - MY_NAME: Windows VS 2017 Debug 64bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2017
      VSINSTALL: "Microsoft Visual Studio\\2017\\Community\\VC\\Auxiliary\\Build"
      MSVC_PLATFORM: amd64
      BUILD_CONFIGURATION: debug
      BUILD_ARCH: x86_64
      SONAR_BW: build-wrapper-win-x86-64.exe

    - MY_NAME: Windows VS 2017 Release 32bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2017
      VSINSTALL: "Microsoft Visual Studio\\2017\\Community\\VC\\Auxiliary\\Build"
      MSVC_PLATFORM: x86
      BUILD_CONFIGURATION: release
      BUILD_ARCH: x86
      SONAR_BW: build-wrapper-win-x86-32.exe

    - MY_NAME: Windows VS 2017 Release 64bit
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2017
      VSINSTALL: "Microsoft Visual Studio\\2017\\Community\\VC\\Auxiliary\\Build"
      MSVC_PLATFORM: amd64
      BUILD_CONFIGURATION: release
      BUILD_ARCH: x86_64
      SONAR_BW: build-wrapper-win-x86-64.exe


matrix:
  fast_finish: false

init:
  - cmd: C:\"Program Files (x86)"\"%VSINSTALL%"\vcvarsall.bat %MSVC_PLATFORM%

install:
  - cmd: |
         choco source add -n "inaos" -s "https://inaos.jfrog.io/inaos/api/nuget/nuget-release-local/" -u %jfrog_artifactory_uid% -p %jfrog_artifactory_pwd%
         choco install inaos-dev-quality-tools -y
         appveyor DownloadFile https://sonarcloud.io/static/cpp/build-wrapper-win-x86.zip

build_script:
  - sh: |
        mkdir cmake-build-$BUILD_CONFIGURATION
        cd cmake-build-$BUILD_CONFIGURATION
        cmake -G "Unix Makefiles" ../ -DCMAKE_BUILD_TYPE=$BUILD_CONFIGURATION
        make
  - cmd: |
         mkdir cmake-build-%BUILD_CONFIGURATION%
         7z e build-wrapper-win-x86.zip -ocmake-build-%BUILD_CONFIGURATION%
         cd cmake-build-%BUILD_CONFIGURATION%
         cmake -G "NMake Makefiles" ../ -DCMAKE_BUILD_TYPE=%BUILD_CONFIGURATION% -DINAC_TARGET_ARCH=%BUILD_ARCH%
         ..\build-wrapper-win-x86\%SONAR_BW% nmake
after_build:
  - sh: cpack
  - cmd: cpack

